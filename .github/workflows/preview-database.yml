name: Preview database

# TEMPORARY. Verifies the connected Neon database and applies the Release 1
# migration to the PREVIEW database only. Removed once Preview is verified.
#
# The Vercel token is referenced once, as ${{ secrets.VERCEL_TOKEN }} in the
# job environment. It is never echoed, written to a file, placed in an
# artifact, or included in output. Shell tracing is never enabled.
#
# DATABASE_URL is pulled into the runner by `vercel env pull` — the documented
# mechanism — and is never printed. The file it lands in is gitignored (.env*)
# and the runner is destroyed with the job.

on:
  push:
    branches:
      - claude/professional-profile-onboarding
    paths:
      - .github/workflows/preview-database.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "verify = names/targets only; migrate = apply Release 1 migration to Preview"
        required: true
        default: verify
        type: choice
        options: [verify, migrate]

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TEAM: team_lrHGYzrhpDXRjeAepo6ezt7Q
  PRJ: prj_5KVjhWtseC2mnPMkMU35D9F40wQV
  SCOPE: daniels-projects-b97d8ae9
  MODE: ${{ inputs.mode || 'verify' }}

jobs:
  preview-db:
    if: >-
      github.repository == 'Wolfwolf22/Fortmark-Dashboard' &&
      github.ref == 'refs/heads/claude/professional-profile-onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard the ref
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            main|master|production|claude/fortmark-dashboard-build-v39u96)
              echo "refusing to run against a release branch"; exit 1 ;;
          esac
          echo "branch: ${{ github.ref_name }} — permitted"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest >/dev/null 2>&1 && vercel --version

      - name: Verify database variables by name and target only
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PRJ/env?teamId=$TEAM" -o /tmp/env.json
          node -e '
            const j=require("/tmp/env.json");
            const db=(j.envs||[]).filter(e=>/^(DATABASE_URL|POSTGRES_|PG)/.test(e.key));
            for(const e of db) console.log(`  ${e.key.padEnd(26)} type=${String(e.type).padEnd(9)} targets=${(e.target||[]).join(",")}`);
            const need=["DATABASE_URL","DATABASE_URL_UNPOOLED"];
            let bad=[];
            for(const k of need){
              const t=new Set(db.filter(e=>e.key===k).flatMap(e=>e.target||[]));
              if(!t.has("preview")||!t.has("production")) bad.push(`${k} (has ${[...t].join("/")||"nothing"})`);
            }
            if(bad.length){console.log("\nMISSING preview+production: "+bad.join("; "));process.exit(1)}
            console.log("\nboth variables present for preview and production");
          '

      - name: Apply Release 1 migration to the PREVIEW database
        if: env.MODE == 'migrate'
        run: |
          set -euo pipefail
          vercel link --yes --project fortmark-dashboard \
            --token "$VERCEL_TOKEN" --scope "$SCOPE" >/dev/null 2>&1

          # Preview scope only. Production is never pulled, so this job cannot
          # reach the production database even by mistake.
          vercel env pull .env.preview --environment=preview \
            --token "$VERCEL_TOKEN" --scope "$SCOPE" >/dev/null 2>&1
          echo "pulled preview environment ($(grep -c '=' .env.preview) variables, values not shown)"

          set -a; . ./.env.preview; set +a
          if [ -z "${DATABASE_URL_UNPOOLED:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "no database URL in the preview environment"; exit 1
          fi
          echo "migration will use: ${DATABASE_URL_UNPOOLED:+DATABASE_URL_UNPOOLED}${DATABASE_URL_UNPOOLED:-DATABASE_URL}"

          npm ci >/dev/null 2>&1
          npx drizzle-kit migrate

          echo "--- tables present in the preview database ---"
          node --experimental-strip-types --conditions=react-server --no-warnings -e '
            const { neon } = await import("@neondatabase/serverless");
            const sql = neon(process.env.DATABASE_URL_UNPOOLED || process.env.DATABASE_URL);
            const rows = await sql`
              select table_name from information_schema.tables
              where table_schema = '"'"'public'"'"' order by table_name`;
            const names = rows.map(r => r.table_name);
            for (const n of names) console.log("  " + n);
            const need = ["audit_events","dashboard_users","professional_profiles","profile_images"];
            const missing = need.filter(n => !names.includes(n));
            if (missing.length) { console.log("MISSING: " + missing.join(", ")); process.exit(1); }
            console.log("\nall four Release 1 tables present");
          '

          npm run db:check
          rm -f .env.preview

      - name: Summary
        if: always()
        run: |
          {
            echo "## Preview database — ${{ env.MODE }}"
            echo ""
            echo "- project: fortmark-dashboard (\`$PRJ\`)"
            echo "- preview scope only; the production database was never pulled"
            echo "- no deployment promoted, aliased, or made production"
            echo ""
            echo "No secret value appears in this run."
          } >> "$GITHUB_STEP_SUMMARY"
