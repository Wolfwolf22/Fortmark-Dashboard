name: Provision profile database

# TEMPORARY. Provisions and inspects the Release 1 Neon database for
# fortmark-dashboard. Removed once Preview is verified.
#
# The token is referenced once, as ${{ secrets.VERCEL_TOKEN }} in the job
# environment. It is never echoed, written to a file, placed in an artifact,
# or included in output. Shell tracing is never enabled and there is no
# env/printenv call. DATABASE_URL is only ever reported by NAME and TARGET.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover = read-only inventory; provision = create/connect the database; migrate = apply migrations to Preview"
        required: true
        default: discover
        type: choice
        options: [discover, provision, migrate]

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TEAM: team_lrHGYzrhpDXRjeAepo6ezt7Q
  PRJ: prj_5KVjhWtseC2mnPMkMU35D9F40wQV
  SCOPE: daniels-projects-b97d8ae9

jobs:
  database:
    # Feature branch only. Never main/master/production, and never the
    # Production branch — this job must not be reachable from a release ref.
    if: >-
      github.repository == 'Wolfwolf22/Fortmark-Dashboard' &&
      github.ref == 'refs/heads/claude/professional-profile-onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard the ref
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            main|master|production|claude/fortmark-dashboard-build-v39u96)
              echo "refusing to run against a release branch"; exit 1 ;;
          esac
          echo "branch: ${{ github.ref_name }} — permitted"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest >/dev/null 2>&1 && vercel --version

      # ------------------------------------------------------------ discover
      - name: Verify access and inventory (read-only)
        run: |
          set -euo pipefail
          vercel whoami --token "$VERCEL_TOKEN" 2>/dev/null | tail -1 > /tmp/who
          echo "account: $(cat /tmp/who)"

          echo "--- project ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PRJ?teamId=$TEAM" -o /tmp/p.json
          node -e 'const j=require("/tmp/p.json");console.log(`  ${j.name} (${j.id}) framework=${j.framework}`)'

          echo "--- marketplace installations ---"
          vercel integration installations --token "$VERCEL_TOKEN" --scope "$SCOPE" </dev/null 2>&1 \
            | grep -viE "telemetry|roadmap|opt-out|learn more|^>" | tail -8 || true

          echo "--- existing env var NAMES on fortmark-dashboard (no values) ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PRJ/env?teamId=$TEAM" -o /tmp/env.json
          node -e '
            const j=require("/tmp/env.json");
            const rows=(j.envs||[]).map(e=>`  ${e.key.padEnd(36)} type=${String(e.type).padEnd(9)} targets=${(e.target||[]).join(",")}`);
            console.log(rows.join("\n") || "  (none)");
            const db=(j.envs||[]).filter(e=>/^(DATABASE_URL|POSTGRES_)/.test(e.key));
            console.log(`\n  database-shaped vars present: ${db.length}`);
          '

      - name: Discover Neon products and plans (read-only)
        if: inputs.mode == 'discover'
        run: |
          set -euo pipefail
          echo "--- vercel integration add neon --help (plan/metadata keys) ---"
          timeout 120 vercel integration add neon --help --token "$VERCEL_TOKEN" --scope "$SCOPE" </dev/null 2>&1 \
            | grep -viE "telemetry|roadmap|opt-out|learn more|^>" | tail -40 || true

      # ----------------------------------------------------------- provision
      - name: Provision or reuse the Neon database
        if: inputs.mode == 'provision'
        run: |
          set -euo pipefail
          # Reuse before creating: never provision a second resource.
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PRJ/env?teamId=$TEAM" -o /tmp/env.json
          HAVE=$(node -e '
            const j=require("/tmp/env.json");
            process.stdout.write(String((j.envs||[]).some(e=>e.key==="DATABASE_URL")));
          ')
          if [ "$HAVE" = "true" ]; then
            echo "DATABASE_URL already present on fortmark-dashboard — reusing, nothing provisioned"
            exit 0
          fi

          echo "provisioning fortmark-dashboard-db (free plan) and connecting to fortmark-dashboard only"
          set +e
          timeout 600 vercel integration add neon \
            --name fortmark-dashboard-db \
            --plan free \
            --environment production --environment preview --environment development \
            --no-claim \
            --token "$VERCEL_TOKEN" --scope "$SCOPE" </dev/null 2>&1 \
            | grep -viE "telemetry|roadmap|opt-out|learn more|^>" | tail -30
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" != "0" ]; then
            echo "provisioning did not complete non-interactively (exit $RC)"
            echo "this is a provider selection boundary, not a credential failure"
            exit 1
          fi

      - name: Confirm DATABASE_URL by name and target only
        if: inputs.mode == 'provision' || inputs.mode == 'migrate'
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PRJ/env?teamId=$TEAM" -o /tmp/env2.json
          node -e '
            const j=require("/tmp/env2.json");
            const db=(j.envs||[]).filter(e=>/^(DATABASE_URL|POSTGRES_|PG)/.test(e.key));
            if(!db.length){console.log("no database variable present");process.exit(1)}
            for(const e of db) console.log(`  ${e.key.padEnd(30)} type=${e.type} targets=${(e.target||[]).join(",")}`);
          '

      # ------------------------------------------------------------- migrate
      - name: Apply migrations to the Preview database
        if: inputs.mode == 'migrate'
        env:
          # Pulled from the project's Preview scope at run time; never printed.
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "PREVIEW_DATABASE_URL secret not set — cannot migrate from CI"
            echo "set it from the Neon Preview branch connection string, or run"
            echo "migrations from a Preview deployment instead"
            exit 1
          fi
          npm ci >/dev/null 2>&1
          npx drizzle-kit migrate
          npm run db:check

      - name: Summary
        if: always()
        run: |
          {
            echo "## Profile database — ${{ inputs.mode }}"
            echo ""
            echo "- project: fortmark-dashboard (\`$PRJ\`)"
            echo "- branch: \`${{ github.ref_name }}\`"
            echo "- no deployment was promoted, aliased, or made production"
            echo "- no domain was modified; fortmark-app and IDx-Server untouched"
            echo ""
            echo "No secret value appears in this run. DATABASE_URL is reported"
            echo "by name and target only."
          } >> "$GITHUB_STEP_SUMMARY"
