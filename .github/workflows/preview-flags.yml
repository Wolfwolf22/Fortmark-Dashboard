name: Preview flags

# TEMPORARY. Sets the Release 1 feature flags on the PREVIEW environment,
# scoped to this feature branch. Removed once Preview is verified.
#
# Why a workflow: Vercel's `sensitive` variables cannot be read back, but they
# can still be written, and the Vercel MCP connector exposes no environment
# management. The API token lives only as a GitHub secret, so this is the one
# place a write can be made from.
#
# The token is referenced once, as ${{ secrets.VERCEL_TOKEN }} in the job
# environment. It is never echoed, written to a file, placed in an artifact, or
# included in output. Shell tracing is never enabled.
#
# The flag VALUES ("0" / "1") are not secrets and are printed deliberately, so
# the run log is a record of exactly what was set.

on:
  push:
    branches:
      - claude/professional-profile-onboarding
    paths:
      - .github/workflows/preview-flags.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "off = all three 0 | database = profile database on | ui = database + UI on"
        required: true
        default: "off"
        type: choice
        options: [off, database, ui]

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TEAM: team_lrHGYzrhpDXRjeAepo6ezt7Q
  PRJ: prj_5KVjhWtseC2mnPMkMU35D9F40wQV
  BRANCH: claude/professional-profile-onboarding
  MODE: ${{ inputs.mode || 'off' }}

jobs:
  preview-flags:
    if: >-
      github.repository == 'Wolfwolf22/Fortmark-Dashboard' &&
      github.ref == 'refs/heads/claude/professional-profile-onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Guard the ref
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            main|master|production|claude/fortmark-dashboard-build-v39u96)
              echo "refusing to run against a release branch"; exit 1 ;;
          esac
          echo "branch: ${{ github.ref_name }} — permitted"

      - name: Set the Release 1 flags on Preview
        run: |
          set -euo pipefail

          case "$MODE" in
            off)      DB=0; UI=0 ;;
            database) DB=1; UI=0 ;;
            ui)       DB=1; UI=1 ;;
            *) echo "unknown mode"; exit 1 ;;
          esac

          # DATABASE_ACCESS_CONTROL_ENABLED is written as 0 in every mode.
          # lib/flags.ts hard-disables it in code regardless, so this is
          # belt-and-braces: the allowlist stays the sole access authority.
          set_flag() {
            local key="$1" value="$2"
            # target=preview + gitBranch confines this to THIS branch's preview
            # deployments. Production and every other branch are untouched.
            local body
            body=$(node -e '
              const [key, value, branch] = process.argv.slice(1);
              process.stdout.write(JSON.stringify({
                key, value, type: "encrypted",
                target: ["preview"], gitBranch: branch,
              }));
            ' "$key" "$value" "$BRANCH")

            local status
            status=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/$PRJ/env?upsert=true&teamId=$TEAM" \
              -d "$body")

            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              echo "  $key -> FAILED (http $status)"
              node -e 'const r=require("/tmp/resp.json");console.log("  "+(r.error?.message??"unknown error"))' || true
              return 1
            fi
            echo "  $key = $value  (preview, branch $BRANCH)"
          }

          echo "mode: $MODE"
          set_flag PROFILE_DATABASE_ENABLED "$DB"
          set_flag PROFESSIONAL_PROFILE_UI_ENABLED "$UI"
          set_flag DATABASE_ACCESS_CONTROL_ENABLED 0

      - name: Confirm by name, target and branch
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PRJ/env?teamId=$TEAM" -o /tmp/env.json
          node -e '
            const j = require("/tmp/env.json");
            const want = ["PROFILE_DATABASE_ENABLED","PROFESSIONAL_PROFILE_UI_ENABLED","DATABASE_ACCESS_CONTROL_ENABLED"];
            const rows = (j.envs||[]).filter(e => want.includes(e.key));
            for (const e of rows) {
              console.log(`  ${e.key.padEnd(34)} targets=${(e.target||[]).join(",")} branch=${e.gitBranch ?? "(all)"}`);
            }
            const prod = rows.filter(e => (e.target||[]).includes("production"));
            if (prod.length) {
              console.log("\nREFUSING: a Release 1 flag is targeting production: " + prod.map(e=>e.key).join(", "));
              process.exit(1);
            }
            console.log("\nno Release 1 flag targets production");
          '

      - name: Summary
        if: always()
        run: |
          {
            echo "## Preview flags — ${{ env.MODE }}"
            echo ""
            echo "- preview target only, scoped to branch \`$BRANCH\`"
            echo "- DATABASE_ACCESS_CONTROL_ENABLED written as 0 and hard-disabled in code"
            echo "- production environment untouched"
            echo ""
            echo "No secret value appears in this run."
          } >> "$GITHUB_STEP_SUMMARY"
